name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Validate repository layout
        shell: pwsh
        run: .\scripts\Test-RepositoryLayout.ps1

      - name: Restore, analyze, and build x64 release
        shell: pwsh
        run: .\scripts\Invoke-Build.ps1 -Configuration Release -Platform x64

      - name: Check package advisories
        shell: pwsh
        run: .\scripts\Test-PackageAdvisories.ps1

      - name: Run regression tests
        shell: pwsh
        run: .\scripts\Run-Tests.ps1 -Configuration Release -Platform x64 -ResultsDirectory .test-results\ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PhoenixEngine-test-results
          path: .test-results/ci/PhoenixEngine.Tests.trx
          if-no-files-found: error

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          $assemblyInfo = Get-Content .\PhoenixEngine\Properties\AssemblyInfo.cs -Raw
          if ($assemblyInfo -notmatch [regex]::Escape("AssemblyFileVersion(`"$tagVersion`")")) {
              throw "Tag $env:GITHUB_REF_NAME does not match the PhoenixEngine file version."
          }

      - name: Package release
        shell: pwsh
        run: |
          $outputDirectory = ".\PhoenixEngine\bin\x64\Release"
          $artifactDirectory = ".\artifacts"
          $artifact = Join-Path $artifactDirectory "PhoenixEngine-win-x64.zip"

          if (-not (Test-Path -LiteralPath (Join-Path $outputDirectory "PhoenixEngine.dll"))) {
              throw "PhoenixEngine.dll was not produced."
          }

          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          Compress-Archive -Path "$outputDirectory\*" -DestinationPath $artifact

          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PhoenixEngine-win-x64.zip" | Set-Content "$artifact.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\artifacts\PhoenixEngine-win-x64.zip" `
            ".\artifacts\PhoenixEngine-win-x64.zip.sha256" `
            --generate-notes `
            --verify-tag
