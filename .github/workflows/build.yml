name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore .\PhoenixEngine.sln -PackagesDirectory .\packages -NonInteractive

      - name: Build x64 release
        shell: pwsh
        run: msbuild .\PhoenixEngine.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Run regression tests
        shell: pwsh
        run: .\scripts\Run-Tests.ps1 -Configuration Release -Platform x64 -ResultsDirectory .test-results\ci
